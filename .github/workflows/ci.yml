name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # Server: type-check, unit tests, and database-backed integration tests
  # ---------------------------------------------------------------------------
  server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ff_user
          POSTGRES_PASSWORD: ff_password
          POSTGRES_DB: fearless_footballer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ff_user -d fearless_footballer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ff_user:ff_password@localhost:5432/fearless_footballer
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      PII_ENCRYPTION_KEY: test-encryption-key-32-chars!!

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Type check
        run: pnpm run check
        working-directory: .

      - name: Generate Prisma Client
        run: pnpm prisma:generate
        working-directory: .

      - name: Apply versioned Prisma migrations
        run: pnpm prisma:migrate:deploy
        working-directory: .

      - name: Seed QA data
        run: pnpm prisma:seed
        working-directory: .

      - name: Run server tests
        run: pnpm test -- --run
        working-directory: .

      - name: Build server
        run: pnpm run build
        working-directory: .

  # ---------------------------------------------------------------------------
  # Mobile: type-check and unit tests
  # ---------------------------------------------------------------------------
  mobile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./mobile

      - name: Type check
        run: pnpm run check
        working-directory: ./mobile

      - name: Run tests
        run: pnpm run test
        working-directory: ./mobile

  # ---------------------------------------------------------------------------
  # Build gate: only on main, after both jobs pass
  # ---------------------------------------------------------------------------
  build:
    needs: [server, mobile]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build mobile app
        run: pnpm run build
        working-directory: ./mobile

      - name: Build backend
        run: pnpm run build
        working-directory: .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            mobile/dist/
            dist/
            server/dist/
