name: Deploy & Cloud Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          # amd64 only: the servers are x86, and building arm64 under QEMU
          # emulation failed fetching Alpine packages.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/fearless-footballer-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fearless-footballer-backend:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/fearless-footballer-backend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/fearless-footballer-backend:cache,mode=max

  mobile-eas-build:
    needs: backend-deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # pnpm must exist before setup-node can cache its store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./mobile

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Check EAS Configuration & Token Availability
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is present. Triggering preview EAS build..."
            eas build --platform all --profile preview --non-interactive
          else
            echo "EXPO_TOKEN secret not configured. Skipping automated cloud build step."
          fi
        working-directory: ./mobile