version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://ff_user:ff_password@db:5432/fearless_footballer?schema=public
      - JWT_ACCESS_SECRET=dev-access-secret-change-me-please-rotate
      - JWT_REFRESH_SECRET=dev-refresh-secret-change-me-please-rotate
      - PII_ENCRYPTION_KEY=dev-pii-encryption-key-change-me-please-rotate
      - CORS_ORIGIN=http://localhost:8000,http://localhost:3000
      - NODE_ENV=development
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/readiness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: ["sh", "-c", "pnpm prisma:migrate:deploy && pnpm prisma:seed && node dist/server/index.js"]
    volumes:
      - ./prisma:/app/prisma:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ff_user
      POSTGRES_PASSWORD: ff_password
      POSTGRES_DB: fearless_footballer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ff_user"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
