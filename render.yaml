services:
  - type: web
    name: fearless-footballer-backend
    env: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    region: ohio
    plan: starter
    healthCheckPath: /health/readiness
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://fearlessfootballer.com,https://staging.fearlessfootballer.com"
